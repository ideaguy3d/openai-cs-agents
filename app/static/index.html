<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Airlines Agent Orchestration (Vanilla JS)</title>
    <link rel="icon" href="/openai_logo.svg" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js"></script>
  </head>
  <body>
    <main class="layout">
      <section class="panel panel-agent">
        <header class="panel-header">
          <h1>Agent View</h1>
          <span>Airline Co.</span>
        </header>

        <div class="panel-body">
          <details class="section" open>
            <summary>Available Agents</summary>
            <div id="agents-list" class="grid grid-3"></div>
          </details>

          <details class="section" open>
            <summary>Conversation Context</summary>
            <div id="context-list" class="grid grid-2"></div>
          </details>

          <details class="section" open>
            <summary>Guardrails</summary>
            <div id="guardrails-list" class="grid grid-3"></div>
          </details>

          <details class="section" open>
            <summary>Runner Output</summary>
            <div id="runner-list" class="stack"></div>
          </details>
        </div>
      </section>

      <section class="panel panel-customer">
        <header class="panel-header">
          <h2>Customer View</h2>
        </header>

        <div class="panel-body customer-body">
          <div id="seat-map-tray" class="seat-map-tray hidden">
            <div class="seat-map-toolbar">
              <p>Select a seat and we will send it to the assistant.</p>
              <button id="close-seat-map-btn" type="button">Close</button>
            </div>
            <div id="seat-map-root"></div>
          </div>

          <div id="chatkit-host" class="chatkit-host">
            <div id="chatkit-loading" class="chatkit-loading">
              Loading ChatKit...
            </div>
          </div>

          <div class="thread-controls">
            <label for="thread-id-input">Thread ID</label>
            <input id="thread-id-input" type="text" placeholder="Paste a thread ID" />
            <div class="button-row">
              <button id="load-thread-btn" type="button">Load Thread</button>
              <button id="refresh-btn" type="button">Refresh</button>
            </div>
            <div class="status-row">
              <span id="thread-status">Loading bootstrap state...</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/main.js" defer></script>
  </body>
</html>
